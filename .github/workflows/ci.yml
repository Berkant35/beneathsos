name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # TODO(setup): pin every action to a full commit SHA before enabling branch protection.
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - run: dart pub global activate melos
      - run: dart pub get
      - run: melos run format:check
      - run: melos run analyze
      - run: melos run check:deps
      - run: melos run check:l10n
      - run: melos run test
