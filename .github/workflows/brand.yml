name: brand
on:
  pull_request:
    paths: ["tools/brand/**", "docs/brand/**", ".github/workflows/brand.yml"]
  push:
    branches: [main]
    paths: ["tools/brand/**", "docs/brand/**", ".github/workflows/brand.yml"]
permissions:
  contents: read
concurrency:
  group: brand-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - run: pip install -r tools/brand/requirements.txt
      # Contrast table, logo geometry, 16 px legibility, icon layers and icon sizes.
      - run: python -m unittest discover -s tests
        working-directory: tools/brand
